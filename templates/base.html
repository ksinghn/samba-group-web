<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Samba GUI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css">
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">Samba GUI</a>
        <div class="collapse navbar-collapse">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="/users">Users</a></li>
            <li class="nav-item"><a class="nav-link" href="/groups">Groups</a></li>
            <li class="nav-item"><a class="nav-link" href="/group-members">Group Members</a></li>
          </ul>
          <form id="connect-form" class="d-flex">
            <input name="host" class="form-control me-1" type="text" placeholder="IP" style="width:110px">
            <input name="port" class="form-control me-1" type="text" placeholder="22" style="width:70px">
            <input name="username" class="form-control me-1" type="text" placeholder="user" style="width:110px">
            <input name="password" class="form-control me-1" type="password" placeholder="password" style="width:140px">
            <button class="btn btn-outline-success" id="connect-btn" type="submit">Connect</button>
            <span id="conn-status" class="ms-2"></span>
          </form>
        </div>
      </div>
    </nav>

    <div class="container mt-3">
      {% block content %}{% endblock %}
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/dataTables.bootstrap5.min.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
