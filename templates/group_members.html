{% extends 'base.html' %}

{% block title %}Group Members - Samba GUI{% endblock %}

{% block content %}
<h2>Group Members Management</h2>

<div class="card">
  <h3>Select Group</h3>
  <p>
    <label for="group-select">Choose a group to manage:</label><br>
    <select id="group-select" style="max-width: 300px;">
      <option value="">-- Select Group --</option>
    </select>
  </p>
</div>

<div id="members-section" style="display:none;">
  <div class="d-flex gap-md">
    <div style="flex:0 0 50%; max-width:50%;">
      <div class="card">
        <h3>Current Members</h3>
        <form id="remove-members-form">
          <table id="members-table" class="display" style="width:100%">
            <thead>
              <tr><th></th><th>Username</th><th>Email</th><th>Groups</th></tr>
            </thead>
            <tbody></tbody>
          </table>
          <button class="btn btn-danger" type="submit" style="display:none;">Remove Selected Members</button>
        </form>
      </div>
    </div>

    <div style="flex:0 0 50%; max-width:50%;">
      <div class="card">
        <h3>Available Users to Add</h3>
        <form id="add-members-form">
          <table id="nonmembers-table" class="display" style="width:100%">
            <thead>
              <tr><th></th><th>Username</th><th>Email</th><th>Groups</th></tr>
            </thead>
            <tbody></tbody>
          </table>
          <button class="btn btn-success" type="submit" style="display:none;">Add Selected Members</button>
        </form>
      </div>
    </div>
  </div>

  <div id="group-members-output" class="mt-3"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const groupSelect = document.getElementById('group-select');
  const membersSection = document.getElementById('members-section');

  function populateGroups(selected) {
    fetch('/api/groups')
      .then(r => r.json())
      .then(data => {
        if (data.groups) {
          data.groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g.name;
            opt.textContent = g.name;
            groupSelect.appendChild(opt);
          });
          if (selected) {
            groupSelect.value = selected;
            groupSelect.dispatchEvent(new Event('change'));
          }
        }
      });
  }

  groupSelect.addEventListener('change', function() {
    if (!this.value) {
      membersSection.style.display = 'none';
      return;
    }
    membersSection.style.display = 'block';
    loadGroupMembers(this.value);
  });

  function buildRow(obj) {
    const groups = Array.isArray(obj.groups) ? obj.groups.join(', ') : '';
    return `\n      <tr>\n        <td><input type="checkbox" name="users" value="${obj.username}"></td>\n        <td>${obj.username}</td>\n        <td>${obj.email || ''}</td>\n        <td>${groups}</td>\n      </tr>`;
  }

  function loadGroupMembers(group) {
    fetch('/api/group_members?group=' + encodeURIComponent(group))
      .then(r => r.json())
      .then(data => {
        const membersTable = document.getElementById('members-table');
        const nonmembersTable = document.getElementById('nonmembers-table');

        // clear existing DataTables if present
        if ($.fn.dataTable.isDataTable('#members-table')) {
          $('#members-table').DataTable().clear().destroy();
        }
        if ($.fn.dataTable.isDataTable('#nonmembers-table')) {
          $('#nonmembers-table').DataTable().clear().destroy();
        }

        membersTable.querySelector('tbody').innerHTML = '';
        nonmembersTable.querySelector('tbody').innerHTML = '';

        if (data.members) {
          data.members.forEach(m => {
            membersTable.querySelector('tbody').insertAdjacentHTML('beforeend', buildRow(m));
          });
        }

        if (data.non_members) {
          data.non_members.forEach(u => {
            nonmembersTable.querySelector('tbody').insertAdjacentHTML('beforeend', buildRow(u));
          });
        }

        // init DataTables
        $('#members-table').DataTable({ paging: true, searching: true, info: true });
        $('#nonmembers-table').DataTable({ paging: true, searching: true, info: true });

        // Show/hide buttons
        document.querySelector('#remove-members-form button').style.display = membersTable.querySelector('tbody').children.length ? 'block' : 'none';
        document.querySelector('#add-members-form button').style.display = nonmembersTable.querySelector('tbody').children.length ? 'block' : 'none';
      });
  }

  // handle add/remove actions
  document.getElementById('add-members-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const users = Array.from(document.querySelectorAll('#add-members-form input[name="users"]:checked')).map(el => el.value);
    if (!users.length) { alert('Please select users to add'); return; }
    fetch('/api/add_members', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ group: groupSelect.value, users: users }) })
      .then(r => r.json()).then(data => { if (data.exit_status === 0) loadGroupMembers(groupSelect.value); });
  });

  document.getElementById('remove-members-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const users = Array.from(document.querySelectorAll('#remove-members-form input[name="users"]:checked')).map(el => el.value);
    if (!users.length) { alert('Please select users to remove'); return; }
    fetch('/api/remove_members', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ group: groupSelect.value, users: users }) })
      .then(r => r.json()).then(data => { if (data.exit_status === 0) loadGroupMembers(groupSelect.value); });
  });

  // If group provided in query string, pre-select
  const params = new URLSearchParams(window.location.search);
  const pre = params.get('group');
  populateGroups(pre);

});
</script>
{% endblock %}
