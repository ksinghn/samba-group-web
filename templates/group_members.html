{% extends 'base.html' %}

{% block title %}Group Members - Samba GUI{% endblock %}

{% block content %}
<h2>Group Members Management</h2>

<div class="card">
  <h3>Select Group</h3>
  <p>
    <label for="group-select">Choose a group to manage:</label><br>
    <select id="group-select" style="max-width: 300px;">
      <option value="">-- Select Group --</option>
    </select>
  </p>
</div>

<div id="members-section" style="display:none;">
  <div class="card">
    <h3>Current Members</h3>
    <form id="remove-members-form">
      <table id="members-table">
        <thead>
          <tr><th></th><th>Username</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn btn-danger" type="submit" style="display:none;">Remove Selected Members</button>
    </form>
  </div>

  <div class="card">
    <h3>Available Users to Add</h3>
    <form id="add-members-form">
      <table id="nonmembers-table">
        <thead>
          <tr><th></th><th>Username</th></tr>
        </thead>
        <tbody></tbody>
      </table>
      <button class="btn btn-success" type="submit" style="display:none;">Add Selected Members</button>
    </form>
  </div>

  <div id="group-members-output" class="mt-3"></div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const groupSelect = document.getElementById('group-select');
  const membersSection = document.getElementById('members-section');

  // Load groups
  fetch('/api/groups')
    .then(r => r.json())
    .then(data => {
      if (data.groups) {
        data.groups.forEach(g => {
          const opt = document.createElement('option');
          opt.value = g.name;
          opt.textContent = g.name;
          groupSelect.appendChild(opt);
        });
      }
    });

  groupSelect.addEventListener('change', function() {
    if (!this.value) {
      membersSection.style.display = 'none';
      return;
    }
    membersSection.style.display = 'block';
    loadGroupMembers(this.value);
  });

  function loadGroupMembers(group) {
    fetch('/api/group_members?group=' + encodeURIComponent(group))
      .then(r => r.json())
      .then(data => {
        const membersTable = document.getElementById('members-table').querySelector('tbody');
        const nonmembersTable = document.getElementById('nonmembers-table').querySelector('tbody');
        
        membersTable.innerHTML = '';
        nonmembersTable.innerHTML = '';

        if (data.members) {
          data.members.forEach(m => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><input type="checkbox" name="users" value="${m}"></td><td>${m}</td>`;
            membersTable.appendChild(tr);
          });
        }

        if (data.non_members) {
          data.non_members.forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><input type="checkbox" name="users" value="${u}"></td><td>${u}</td>`;
            nonmembersTable.appendChild(tr);
          });
        }

        // Show/hide buttons
        document.querySelector('#remove-members-form button').style.display = membersTable.children.length ? 'block' : 'none';
        document.querySelector('#add-members-form button').style.display = nonmembersTable.children.length ? 'block' : 'none';
      });
  }

  document.getElementById('add-members-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const users = Array.from(document.querySelectorAll('#add-members-form input[name="users"]:checked')).map(el => el.value);
    if (!users.length) {
      alert('Please select users to add');
      return;
    }
    fetch('/api/add_members', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group: groupSelect.value, users: users })
    }).then(r => r.json()).then(data => {
      if (data.exit_status === 0) {
        loadGroupMembers(groupSelect.value);
      }
    });
  });

  document.getElementById('remove-members-form').addEventListener('submit', function(e) {
    e.preventDefault();
    const users = Array.from(document.querySelectorAll('#remove-members-form input[name="users"]:checked')).map(el => el.value);
    if (!users.length) {
      alert('Please select users to remove');
      return;
    }
    fetch('/api/remove_members', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ group: groupSelect.value, users: users })
    }).then(r => r.json()).then(data => {
      if (data.exit_status === 0) {
        loadGroupMembers(groupSelect.value);
      }
    });
  });
});
</script>
{% endblock %}
